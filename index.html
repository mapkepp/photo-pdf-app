<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото в PDF</title>
    <!-- Исправление пути к CSS -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <h1>Фото в PDF конвертер</h1>

        <div class="title-section">
            <label for="document-title">Заголовок документа:</label>
            <input type="text" id="document-title" placeholder="Введите заголовок для PDF" value="Мои фотографии">

            <label for="subtitle" style="margin-top: 15px; display: block;">Текст под заголовком:</label>
            <textarea id="subtitle" class="comment-field" rows="3" placeholder="Дополнительный текст под заголовком документа"></textarea>
        </div>

        <div class="upload-section">
            <label for="photo-upload" class="upload-label">
                🖼️ Выберите фотографии
            </label>
            <input type="file" id="photo-upload" accept="image/jpeg,image/png,image/webp" multiple>
            <button id="clear-preview" class="clear-button">Очистить предпросмотр</button>
        </div>

        <div id="pdf-status" class="status-message">Ожидание загрузки библиотек...</div>

        <div class="preview-section">
            <h2>Предпросмотр фотографий (перетаскивайте для изменения порядка)</h2>
            <div id="photo-preview" class="preview-container"></div>
        </div>

        <div class="controls">
            <button id="generate-pdf" disabled>Создать PDF</button>
            <a id="download-link" class="hidden" download="photos.pdf">Скачать PDF</a>
        </div>
    </div>

    <!-- Исправления путей к JS‑библиотекам -->
    <script src="./pdfmake.min.js"></script>
    <script src="./vfs_fonts.js"></script>
    <script type="module" src="./photo-preview.js"></script>
    <script type="module" src="./event-listeners.js"></script>
</body>
</html>
