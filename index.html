<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото в PDF — Конвертер изображений</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="photo-preview.css">

    <!-- Подгрузка шрифтов и дополнительных стилей -->
    <style>
        @font-face {
            font-family: 'DejaVu Sans';
            src: url('./DejaVuSans.ttf') format('truetype');
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>📸 Фото в PDF</h1>
            <p>Конвертируйте ваши фотографии в PDF с комментариями</p>
        </header>

        <main class="main-content">
            <!-- Форма настроек документа -->
            <section class="document-settings">
                <h2>Настройки документа</h2>
                <div class="form-group">
                    <label for="document-title">Заголовок PDF:</label>
            <input
                type="text"
                id="document-title"
                class="input-field"
                placeholder="Фотоотчёт"
                value="Фотоотчёт"
            >
        </div>
        <div class="form-group">
            <label for="subtitle">Подзаголовок:</label>
            <textarea
                id="subtitle"
                class="textarea-field"
                rows="2"
                placeholder="Описание фотоотчёта..."
            ></textarea>
        </div>
    </section>

    <!-- Загрузка фотографий -->
    <section class="photo-upload">
        <h2>Загрузка фотографий</h2>
        <div class="upload-controls">
            <input
                type="file"
                id="photo-upload"
                class="file-input"
                accept="image/*"
                multiple
            >
            <label for="photo-upload" class="btn btn-primary">
                🖼️ Выбрать фотографии
            </label>
            <button id="add-photos" class="btn btn-secondary">
                ➕ Добавить ещё фото
            </button>
        </div>

        <!-- Статус операций -->
        <div id="pdf-status" class="status-message"></div>
    </section>

    <!-- Предпросмотр фотографий -->
    <section class="preview-section">
        <h2>Предпросмотр фотографий</h2>
        <div id="photo-preview" class="photo-grid">
            <!-- Здесь будут отображаться превью фотографий -->
        </div>
    </section>

    <!-- Действия -->
    <section class="action-buttons">
        <button id="generate-pdf" class="btn btn-success">
            🖨️ Создать PDF
        </button>
        <a id="download-link" class="btn btn-download" href="#" download style="display: none;">
            ⬇️ Скачать PDF
        </a>
        <button id="clear-preview" class="btn btn-danger">
            🗑️ Очистить всё
        </button>
    </section>
</main>

<footer class="app-footer">
    <p>© 2026 Фото в PDF. Все права защищены.</p>
</footer>
</div>

<!-- Скрипты -->
<script type="module" src="./event-listeners.js"></script>
<script type="module" src="./image-optimizer.js"></script>
<script type="module" src="./photo-preview.js"></script>
<script type="module" src="./photo-utils.js"></script>
<script type="module" src="./pdfmake-generator.js"></script>
<script type="module">
    // Инициализация приложения после загрузки DOM
    document.addEventListener('DOMContentLoaded', () => {
        setupEventListeners();
        console.log('✅ Приложение инициализировано');
    });
</script>
</body>
</html>
