<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Просмотр фото</title>
    <style>
        .photo-item {
            margin: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            max-width: 300px;
        }
        .photo-item img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .controls {
            margin-top: 5px;
        }
        #photo-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        textarea {
            width: 100%;
            margin-top: 5px;
        }
        .hidden {
            display: none;
        }
        button {
            margin: 2px;
            padding: 5px 10px;
        }
        /* Добавляем индикатор загрузки */
        #loading-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <h1>Предварительный просмотр фото</h1>
    <input type="file" id="photo-upload" accept="image/jpeg,image/png,image/webp" multiple>
    <div id="photo-container"></div>

    <h2>Генерация PDF</h2>
    <input type="text" id="title" placeholder="Заголовок PDF" value="Мои фотографии">
    <button id="generate-pdf">Создать PDF</button>
    <a id="download-link" class="hidden" download="photos.pdf">Скачать PDF</a>

    <!-- Индикатор загрузки -->
    <div id="loading-status">Загрузка библиотек...</div>

    <!-- Подключаем jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Подключаем модули в правильном порядке -->
    <script type="module" src="fonts.js"></script>
    <script type="module" src="photo-utils.js"></script>
    <script type="module" src="photo-display.js"></script>
    <script type="module" src="pdf-utils.js"></script>
    <script type="module" src="pdf-page-manager.js"></script>
    <script type="module" src="pdf-photo-renderer.js"></script>
    <script type="module" src="pdf-generator.js"></script>
    <script type="module" src="event-listeners.js"></script>

    <script>
        // Отслеживаем загрузку jsPDF
        window.addEventListener('load', function() {
            setTimeout(() => {
                const status = document.getElementById('loading-status');
                if (window.jspdf) {
                    status.textContent = 'Готово к работе!';
            } else {
                status.textContent = 'Ошибка: jsPDF не загружен';
                status.style.background = '#ffdddd';
            }
            }, 500);
        });
    </script>
</body>
</html>
