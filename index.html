<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <meta name="msapplication-TileImage" content="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsQAAA7EAZUrDhsAAAANSURBVBhXYzh8+PB/AAffA0nNPuCLAAAAAElFTkSuQmCC">
    <title>Просмотр фото</title>
    <style>
        .photo-item {
            margin: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            max-width: 300px;
        }
        .photo-item img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .controls {
            margin-top: 5px;
        }
        #photo-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        textarea {
            width: 100%;
            margin-top: 5px;
        }
        .hidden {
            display: none;
        }
        button {
            margin: 2px;
            padding: 5px 10px;
        }

        /* Индикатор статуса */
        #pdf-status {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Стили для контейнера предпросмотра фото */
        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin: 20px 0;
            padding: 15px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        /* Элемент предпросмотра фото */
        .photo-preview-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        /* Стили для изображения в предпросмотре */
        .preview-image {
            width: 100%;
            max-width: 150px;
            max-height: 150px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .preview-image:hover {
            transform: scale(1.05);
        }

        /* Подпись под фото */
        .preview-caption {
            font-size: 12px;
            text-align: center;
            color: #666;
            word-break: break-all;
        }

        /* Стили для элементов с ошибками */
        .photo-preview-item.error {
            background-color: #ffeaea;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .error-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <h1>Предварительный просмотр фото</h1>

    <!-- Поле для загрузки фото -->
    <div class="upload-section">
        <label for="photo-upload" class="upload-label">
            Выберите фотографии для добавления в PDF
        </label>
        <input type="file" id="photo-upload" accept="image/jpeg,image/png,image/webp" multiple>
    </div>

    <!-- Контейнер для предпросмотра -->
    <div id="photo-preview" class="preview-container">
        <!-- Здесь будут отображаться превью фото -->
        <div class="empty-preview-message">
            Загрузите фотографии для предпросмотра
        </div>
    </div>

    <h2>Генерация PDF</h2>
    <input type="text" id="title" placeholder="Заголовок PDF" value="Мои фотографии">
    <button id="generate-pdf" disabled>Создать PDF</button>
    <div id="pdf-status">Ожидание загрузки библиотек...</div>
    <a id="download-link" class="hidden" download="photos.pdf">Скачать PDF</a>

    <!-- Локальная копия jsPDF -->
    <script src="./jspdf.umd.min.js"></script>

    <!-- Подключаем модули в правильном порядке -->
    <script type="module" src="fonts.js"></script>
    <script type="module" src="photo-utils.js"></script>
    <script type="module" src="photo-display.js"></script>
    <script type="module" src="pdf-utils.js"></script>
    <script type="module" src="pdf-page-manager.js"></script>
    <script type="module" src="pdf-photo-renderer.js"></script>
    <script type="module" src="pdf-generator.js"></script>
    <script type="module" src="event-listeners.js"></script>

    <script>
        // Глобальная переменная для хранения фото
        window.photos = [];

        // Отслеживаем загрузку jsPDF
        window.addEventListener('load', function() {
            setTimeout(() => {
                const status = document.getElementById('pdf-status');
                if (window.jspdf) {
                    status.textContent = 'jsPDF загружен, готов к работе';
            status.style.color = 'green';

            // Дополнительная диагностика
            console.log('jsPDF объект:', window.jspdf);
            console.log('Доступен ли addFont:', !!(window.jspdf.jsPDF && window.jspdf.jsPDF.prototype.addFont));
        } else {
            status.textContent = 'Ошибка: jsPDF не загружен';
            status.style.background = '#ffdddd';
        }
            }, 500);
        });

        // Обработчик загрузки фото — активирует кнопку после выбора файлов
        document.getElementById('photo-upload').addEventListener('change', (e) => {
            const files = e.target.files;
            const generatePdfButton = document.getElementById('generate-pdf');

            if (files.length > 0) {
                // Сохраняем файлы в глобальную переменную
                window.photos = Array.from(files);

                // Активируем кнопку
                generatePdfButton.disabled = false;
                console.log(`✓ Загружено ${files.length} фото(ов), кнопка активирована`);

                // Обновляем статус
                const status = document.getElementById('pdf-status');
                status.textContent = `Загружено ${files.length} фото(ов). Готов к созданию PDF.`;
                status.style.color = 'blue';
            } else {
                // Если файлов нет, деактивируем кнопку
                generatePdfButton.disabled = true;
                console.log('ℹ️ Фото не выбраны, кнопка деактивирована');
            }
        });
    </script>
</body>
</html>
