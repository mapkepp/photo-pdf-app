<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="msapplication-TileImage" content="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsQAAA7EAZUrDhsAAAANSURBVBhXYzh8+PB/AAffA0nNPuCLAAAAAElFTkSuQmCC">
    <title>Просмотр фото</title>
    <style>
        .photo-item {
            margin: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            max-width: 300px;
        }
        .photo-item img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .controls {
            margin-top: 5px;
        }
        #photo-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        textarea {
            width: 100%;
            margin-top: 5px;
        }
        .hidden {
            display: none;
        }
        button {
            margin: 2px;
            padding: 5px 10px;
        }
        /* Индикатор статуса */
        #pdf-status {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Предварительный просмотр фото</h1>
    <input type="file" id="photo-upload" accept="image/jpeg,image/png,image/webp" multiple>
    <div id="photo-container"></div>

    <h2>Генерация PDF</h2>
    <input type="text" id="title" placeholder="Заголовок PDF" value="Мои фотографии">
    <button id="generate-pdf" disabled>Создать PDF</button>
    <div id="pdf-status">Ожидание загрузки библиотек...</div>
    <a id="download-link" class="hidden" download="photos.pdf">Скачать PDF</a>

    <!-- Локальная копия jsPDF -->
    <script src="./jspdf.umd.min.js"></script>

    <!-- Подключаем модули в правильном порядке -->
    <script type="module" src="fonts.js"></script>
    <script type="module" src="photo-utils.js"></script>
    <script type="module" src="photo-display.js"></script>
    <script type="module" src="pdf-utils.js"></script>
    <script type="module" src="pdf-page-manager.js"></script>
    <script type="module" src="pdf-photo-renderer.js"></script>
    <script type="module" src="pdf-generator.js"></script>
    <script type="module" src="event-listeners.js"></script>
    <script>
    // Отслеживаем загрузку jsPDF
    window.addEventListener('load', function() {
        setTimeout(() => {
            const status = document.getElementById('pdf-status');
            if (window.jspdf) {
                status.textContent = 'jsPDF загружен, готов к работе';
                status.style.color = 'green';
            } else {
                status.textContent = 'Ошибка: jsPDF не загружен';
                status.style.background = '#ffdddd';
            }
        }, 500);
    });
</script>
    <script>
    // Диагностика загрузки jsPDF и шрифта
    window.addEventListener('load', function() {
        setTimeout(() => {
            const status = document.getElementById('pdf-status');

            if (window.jspdf) {
                status.textContent = 'jsPDF загружен, готов к работе';
                status.style.color = 'green';

                // Дополнительная диагностика
                console.log('jsPDF объект:', window.jspdf);
                console.log('Доступен ли addFont:', !!(window.jspdf.jsPDF && window.jspdf.jsPDF.prototype.addFont));
            } else {
                status.textContent = 'Ошибка: jsPDF не загружен';
                status.style.background = '#ffdddd';
            }
        }, 500);
    });
</script>

    
</body>
</html>
