<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор PDF с фотографиями</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Генератор PDF с фотографиями</h1>
        
        <div class="input-group">
            <label for="title">Заголовок PDF:</label>
            <input type="text" id="title" placeholder="Введите заголовок (например, 'Семейный альбом')" value="Мои фотографии">
        </div>
        
        <div class="input-group">
            <label for="photo-upload">Загрузите фотографии:</label>
            <input type="file" id="photo-upload" accept="image/*" multiple>
        </div>
        
        <button id="generate-pdf">Сгенерировать PDF</button>
        <a id="download-link" class="hidden" download="мои_фотографии.pdf">Скачать PDF</a>
        
        <div id="photo-container"></div>
    </div>

    <!-- Подключаем библиотеки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Главный скрипт -->
    <script type="module" src="main.js"></script>
</body>
</html>
