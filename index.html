<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото в PDF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Создание PDF из фотографий</h1>
        
        <label for="title">Заголовок:</label>
        <input type="text" id="title" placeholder="Введите заголовок на кириллице">
        
        <label for="photo-upload">Добавить фотографии:</label>
        <input type="file" id="photo-upload" accept="image/*" multiple>
        
        <div id="photo-container"></div>
        
        <button id="generate-pdf">Сгенерировать PDF</button>
        <a id="download-link" class="hidden" download="my-photos.pdf">Скачать PDF</a>
    </div>

    <!-- Подключаем библиотеку jsPDF для генерации PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Подключаем шрифт DejaVu Sans для поддержки кириллицы -->
    <script>
        // Загружаем шрифт DejaVuSans для поддержки кириллических символов
        const fontUrl = 'https://cdnjs.cloudflare.com/ajax/libs/dejavu-sans-ttf/1.0.0/DejaVuSans.ttf';
        fetch(fontUrl)
            .then(response => response.arrayBuffer())
            .then(buffer => {
                // Глобальная переменная для хранения шрифта
                window.dejaVuFont = buffer;
            })
            .catch(err => console.error('Ошибка загрузки шрифта:', err));
    </script>
    <!-- Подключаем наш скрипт с логикой приложения -->
    <script src="script.js"></script>
</body>
</html>
